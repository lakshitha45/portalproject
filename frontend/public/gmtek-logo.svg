<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;display=swap');
      text {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 44px;
      }
      .solid {
        fill: #15B8AD;
      }
      .outline {
        fill: none;
        stroke: #15B8AD;
        stroke-width: 3px;
        stroke-linejoin: miter;
      }
    </style>
  </defs>
  
  <g transform="translate(10, 42) skewX(-12)">
    <text x="0" y="0" class="solid" letter-spacing="-2">GM</text>
    <text x="85" y="0" class="outline" letter-spacing="1">TEK</text>
  </g>
</svg>
