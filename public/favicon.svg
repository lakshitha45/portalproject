    <!-- r=52 flat-topped -->
    <path id="h_big" d="M 26 -45.03 L -26 -45.03 L -52 0 L -26 45.03 L 26 45.03 L 52 0 Z" />
  </defs>
  <!-- Center elements within the 256x256 box -->
  <g transform="translate(120, 125)">
